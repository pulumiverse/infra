name: Pull Request
on:
  merge_group:
  pull_request:
    paths-ignore:
      - '01-teams/**'
      - '02-repositories/**'
      - '03-members/**'
      - '.github/workflows/provider-*.yaml'
  pull_request_target:
    paths:
      - '01-teams/**'
      - '02-repositories/**'
      - '03-members/**'

jobs:
  preview-changes:
    name: Preview changes
    runs-on: ubuntu-latest
    steps:
      # Checkout code when the event is `pull_request`
      - name: Checkout code
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      # GitHub computes the merge commit asynchronously — mergeable/merge_commit_sha
      # can be null when the event fires. Poll with binary exponential backoff
      # (max 5 retries) before failing. Docs: https://docs.github.com/en/rest/pulls/pulls#checking-mergeability-of-pull-requests
      - name: Wait for merge commit
        if: github.event_name == 'pull_request_target'
        id: wait-for-merge
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const delays = [2, 4, 8, 16, 32]; // binary exp, 5 retries, 62s total (2+4+8+16+32)
            for (let attempt = 0; attempt <= delays.length; attempt++) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              if (pr.mergeable === true && pr.merge_commit_sha) {
                core.setOutput('sha', pr.merge_commit_sha);
                core.info(`Merge commit ready: ${pr.merge_commit_sha}`);
                return;
              }
              if (pr.mergeable === false) {
                core.setFailed('PR has merge conflicts — cannot create merge commit');
                return;
              }
              if (attempt < delays.length) {
                const delay = delays[attempt];
                core.info(`mergeable=${pr.mergeable} (attempt ${attempt + 1}/${delays.length + 1}), retrying in ${delay}s`);
                await new Promise(r => setTimeout(r, delay * 1000));
              }
            }
            core.setFailed('Timed out waiting for GitHub to publish merge commit after 5 retries (62s). Re-run job.');

      # Checkout code when the event is `pull_request_target`
      - name: Checkout code
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v7
        with:
          ref: '${{ steps.wait-for-merge.outputs.sha }}'
          allow-unsafe-pr-checkout: true
          # The guard below diffs against the merge base, which needs real history.
          fetch-depth: 0

      # Enforce YAML-only changes for fork PRs
      - name: Enforce YAML-only changes for fork PRs
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          # Fetch the base branch to calculate the diff
          git fetch origin ${{ github.base_ref }}

          # Get a list of all files changed by the PR
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Regex: Match ONLY .yml/.yaml files inside the allowed root directories
          UNEXPECTED_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^(01-teams|02-repositories|03-members)/.*\.(yml|yaml)$' | grep -v '^$' || true)

          if [ -n "$UNEXPECTED_FILES" ]; then
            echo "::error::Policy Violation: Fork PRs are only allowed to modify YAML files in 01-teams, 02-repositories, or 03-members."
            echo "The following unexpected files were modified:"
            echo "$UNEXPECTED_FILES"
            exit 1
          fi

      - uses: volta-cli/action@v5

      - run: npm ci

      - uses: pulumi/actions@v7
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        with:
          command: preview
          stack-name: pulumiverse/prod
          pulumi-version: 3.216.0 # must be aligned with version used in package.json
